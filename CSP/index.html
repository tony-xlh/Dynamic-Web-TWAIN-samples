<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' blob: https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        img-src 'self' data: blob:
          http://localhost:* https://localhost:*
          http://127.0.0.1:* https://127.0.0.1:*;
        font-src 'self' data:;
        connect-src 'self' blob:
          https://www.dynamsoft.com https://demo.dynamsoft.com
          https://mlds.dynamsoft.com https://sdls.dynamsoft.com
          http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*
          http://127.0.0.1:* https://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:*;
        worker-src 'self' blob:;
        frame-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <script src="https://cdn.jsdelivr.net/npm/dwt/dist/dynamsoft.webtwain.min.js"></script>
  </head>

  <body>
    <button id="btnScan">Scan</button>
    <button id="btnUpload">Upload</button>
    <button id="btnBinarize">Convert to BW</button>
    <button id="btnRotateCW">Rotate Clockwise</button>
    <button id="btnRotateCCW">Rotate Counter-Clockwise</button>
    <div id="dwtcontrolContainer"></div>

    <script src="dwt-script.js"></script>
  </body>
</html>
